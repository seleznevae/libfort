name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # wchar tests call setlocale(LC_CTYPE, "") and need a UTF-8 locale
  LANG: C.UTF-8

jobs:
  linux-basic:
    name: Linux gcc (basic)
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v5

      - name: Print tool versions
        run: |
          ${CC} --version
          ${CXX} --version
          cmake --version
          python3 --version

      # lib/ must be exactly what amalgamate.py generates from src/
      - name: Check amalgamation is up to date
        run: |
          python3 amalgamate.py
          git diff --exit-code -- lib/

      # Old C standard (gnu89 instead of c89 because some functions are not defined in c89)
      - name: Build lib/fort.c as gnu89
        run: ${CC} -Wall -Wextra -Werror -std=gnu89 -c lib/fort.c -o fort.o

      - name: Build lib/fort.c with C++ compiler
        run: ${CXX} -Wall -Wextra -Werror -x c++ -c lib/fort.c -o fort.o

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_STANDARD=99
          -DCMAKE_CXX_STANDARD=11
          -DCMAKE_C_FLAGS=-Werror
          -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Compilers
          - { name: gcc-9,  cc: gcc-9,  cxx: g++-9,  packages: gcc-9 g++-9 }
          - { name: gcc-10, cc: gcc-10, cxx: g++-10, packages: gcc-10 g++-10 }
          - { name: gcc-11, cc: gcc-11, cxx: g++-11, packages: gcc-11 g++-11 }
          - { name: gcc-12, cc: gcc-12, cxx: g++-12, packages: gcc-12 g++-12 }
          - { name: gcc-13, cc: gcc-13, cxx: g++-13, packages: gcc-13 g++-13 }
          - { name: gcc-14, cc: gcc-14, cxx: g++-14, packages: gcc-14 g++-14 }
          - { name: clang-14, cc: clang-14, cxx: clang++-14, packages: clang-14 }
          - { name: clang-15, cc: clang-15, cxx: clang++-15, packages: clang-15 }
          - { name: clang-16, cc: clang-16, cxx: clang++-16, packages: clang-16 }
          - { name: clang-17, cc: clang-17, cxx: clang++-17, packages: clang-17 }
          - { name: clang-18, cc: clang-18, cxx: clang++-18, packages: clang-18 }
          - { name: clang-19, cc: clang-19, cxx: clang++-19, packages: clang-19 }
          - { name: clang-20, cc: clang-20, cxx: clang++-20, packages: clang-20 }
          # Sanitizers
          - { name: gcc-14 asan,    cc: gcc-14,   cxx: g++-14,     packages: gcc-14 g++-14, cmake_args: -DFORT_BUILD_TYPE=asan }
          - { name: gcc-14 ubsan,   cc: gcc-14,   cxx: g++-14,     packages: gcc-14 g++-14, cmake_args: -DFORT_BUILD_TYPE=ubsan }
          - { name: clang-20 asan,  cc: clang-20, cxx: clang++-20, packages: clang-20,      cmake_args: -DFORT_BUILD_TYPE=asan }
          - { name: clang-20 ubsan, cc: clang-20, cxx: clang++-20, packages: clang-20,      cmake_args: -DFORT_BUILD_TYPE=ubsan }
          # Without wchar and UTF-8 support
          - { name: no wchar/utf8, cc: gcc, cxx: g++, cmake_args: -DFORT_ENABLE_WCHAR=OFF -DFORT_ENABLE_UTF8=OFF }
          # ARM64 (native runner)
          - { name: arm64 gcc,   os: ubuntu-24.04-arm, cc: gcc,   cxx: g++ }
          - { name: arm64 clang, os: ubuntu-24.04-arm, cc: clang, cxx: clang++, packages: clang }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      # Newer kernels use high-entropy ASLR that breaks ASan in some compiler versions
      - name: Reduce ASLR entropy for sanitizers
        if: contains(matrix.cmake_args, 'FORT_BUILD_TYPE')
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Print tool versions
        run: |
          ${CC} --version
          ${CXX} --version
          cmake --version

      - name: Build lib/fort.c as gnu89
        run: ${CC} -Wall -Wextra -Werror -std=gnu89 -c lib/fort.c -o fort.o

      - name: Build lib/fort.c with C++ compiler
        run: ${CXX} -Wall -Wextra -Werror -x c++ -c lib/fort.c -o fort.o

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_STANDARD=99
          -DCMAKE_CXX_STANDARD=11
          -DCMAKE_C_FLAGS=-Werror
          -DCMAKE_CXX_FLAGS=-Werror
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  integration:
    name: Integration ${{ matrix.name }} (install, find_package, add_subdirectory)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,               os: ubuntu-24.04 }
          - { name: macOS,               os: macos-15 }
          - { name: Windows MSVC,        os: windows-2022 }
          - { name: Windows MSVC shared, os: windows-2022, shared: true }
    defaults:
      run:
        shell: bash
    env:
      CONFIG: Release
      SHARED: ${{ matrix.shared && 'ON' || 'OFF' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set paths
        run: |
          # CMake on Windows needs native paths (D:/a/...), not MSYS ones (/d/a/...)
          if [ "$RUNNER_OS" = Windows ]; then
            root=$(cygpath -m "$GITHUB_WORKSPACE")
            # Multi-config generator puts executables to <build dir>/<config>
            echo "EXE_SUBDIR=$CONFIG/" >> "$GITHUB_ENV"
          else
            root=$GITHUB_WORKSPACE
          fi
          echo "INSTALL_DIR=$root/install" >> "$GITHUB_ENV"
          # Installed fort.dll for shared build on Windows
          echo "$root/install/bin" >> "$GITHUB_PATH"

      - name: Build and install libfort
        run: |
          cmake -S . -B build -DFORT_ENABLE_TESTING=OFF -DBUILD_SHARED_LIBS="$SHARED" -DCMAKE_BUILD_TYPE="$CONFIG" -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR"
          cmake --build build --config "$CONFIG" --parallel
          cmake --install build --config "$CONFIG"

      - name: Test find_package integration
        working-directory: tests/package_tests
        run: |
          cmake -S . -B _build -DCMAKE_BUILD_TYPE="$CONFIG" -DCMAKE_PREFIX_PATH="$INSTALL_DIR" -DCMAKE_INSTALL_PREFIX=./_install_foo
          cmake --build _build --config "$CONFIG" --parallel
          "./_build/${EXE_SUBDIR}foo-app"
          cmake --install _build --config "$CONFIG"

      - name: Test pkg-config integration
        if: runner.os == 'Linux'
        working-directory: tests/package_tests
        run: |
          check_pkg_config() {
            export PKG_CONFIG_PATH="$1"
            pkg-config --print-errors --exists libfort
            echo "libfort.pc flags: $(pkg-config --cflags --libs libfort)"
            c++ foo-app.cpp $(pkg-config --cflags --libs libfort) -o _foo-app-pkg-config
            ./_foo-app-pkg-config
          }
          check_pkg_config "$(dirname "$(find "$INSTALL_DIR" -name libfort.pc)")"

          # Absolute CMAKE_INSTALL_<dir> (e.g. in Nix) must not be prefixed with ${prefix} in libfort.pc.
          # They are outside of the source tree since CMake doesn't allow absolute include dirs in it.
          abs_dir="$RUNNER_TEMP/libfort-abs-dirs"
          cmake -S ../.. -B _build_abs_dirs -DFORT_ENABLE_TESTING=OFF -DCMAKE_BUILD_TYPE="$CONFIG" \
            -DCMAKE_INSTALL_PREFIX="$abs_dir/prefix" \
            -DCMAKE_INSTALL_INCLUDEDIR="$abs_dir/include" \
            -DCMAKE_INSTALL_LIBDIR="$abs_dir/lib"
          cmake --build _build_abs_dirs --parallel
          cmake --install _build_abs_dirs
          check_pkg_config "$abs_dir/lib/pkgconfig"

      # libfort is copied (not symlinked) because symlinks need special privileges on Windows
      - name: Test add_subdirectory integration
        working-directory: tests/add_subdirectory_tests
        run: |
          mkdir libfort
          cp -r ../../CMakeLists.txt ../../lib ../../cmake libfort/
          cmake -S . -B _build -DCMAKE_BUILD_TYPE="$CONFIG" -DBUILD_SHARED_LIBS="$SHARED" -DCMAKE_INSTALL_PREFIX=./_install_foo
          cmake --build _build --config "$CONFIG" --parallel
          PATH="$(pwd)/_build/libfort/lib/${EXE_SUBDIR}:$PATH" "./_build/${EXE_SUBDIR}foo-app"
          cmake --install _build --config "$CONFIG"

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install gcovr
        run: pipx install gcovr

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFORT_BUILD_TYPE=coveralls

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # lib/fort.c is skipped because it is amalgamation of src/*.c,
      # src/utf8.h is third-party code
      - name: Generate coverage report
        run: >
          gcovr --root . --object-directory build
          --filter 'src/' --filter 'lib/fort\.hpp' --exclude 'src/utf8\.h'
          --print-summary --cobertura coverage.xml

      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  freebsd:
    name: FreeBSD 14 clang
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build and test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: pkg install -y cmake
          run: |
            set -e
            export LANG=C.UTF-8
            uname -a
            cc --version
            c++ --version
            cmake --version

            # Basic C and C++ builds
            cc -Wall -Wextra -Werror -std=gnu89 -c lib/fort.c -o fort.o
            c++ -Wall -Wextra -Werror -x c++ -c lib/fort.c -o fort.o

            run_cmake() {
              dir=$1; shift
              cmake -S . -B "$dir" \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_STANDARD=99 \
                -DCMAKE_CXX_STANDARD=11 \
                -DCMAKE_C_FLAGS=-Werror \
                -DCMAKE_CXX_FLAGS=-Werror \
                "$@"
              # BSD make doesn't accept bare -j, so the job count must be explicit
              cmake --build "$dir" --parallel "$(sysctl -n hw.ncpu)"
            }

            # ASan doesn't work reliably with ASLR (enabled by default since FreeBSD 13.2)
            run_cmake build-asan -DFORT_BUILD_TYPE=asan
            proccontrol -m aslr -s disable ctest --test-dir build-asan --output-on-failure

            run_cmake build-ubsan -DFORT_BUILD_TYPE=ubsan
            ctest --test-dir build-ubsan --output-on-failure

            run_cmake build-nowchar -DFORT_ENABLE_WCHAR=OFF -DFORT_ENABLE_UTF8=OFF
            ctest --test-dir build-nowchar --output-on-failure

  macos:
    name: macOS ${{ matrix.os }} ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15 }
          - { os: macos-15, name: asan,  cmake_args: -DFORT_BUILD_TYPE=asan }
          - { os: macos-15, name: ubsan, cmake_args: -DFORT_BUILD_TYPE=ubsan }
          - { os: macos-15, name: no wchar/utf8, cmake_args: -DFORT_ENABLE_WCHAR=OFF -DFORT_ENABLE_UTF8=OFF }
          # Intel
          - { os: macos-15-intel }
    env:
      # C.UTF-8 may be missing on macOS
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v5

      - name: Print tool versions
        run: |
          sw_vers
          uname -m
          cc --version
          cmake --version

      - name: Build lib/fort.c as gnu89
        run: cc -Wall -Wextra -Werror -std=gnu89 -c lib/fort.c -o fort.o

      - name: Build lib/fort.c with C++ compiler
        run: c++ -Wall -Wextra -Werror -x c++ -c lib/fort.c -o fort.o

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_STANDARD=99
          -DCMAKE_CXX_STANDARD=11
          -DCMAKE_C_FLAGS=-Werror
          -DCMAKE_CXX_FLAGS=-Werror
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    name: Windows MSVC ${{ matrix.arch }} ${{ matrix.config }} ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, arch: x64,   config: Debug }
          - { os: windows-2022, arch: x64,   config: Release }
          - { os: windows-2022, arch: Win32, config: Debug }
          - { os: windows-2022, arch: Win32, config: Release }
          - { os: windows-2025, arch: x64,   config: Release }
          # Strict conformance mode, as it was tested on AppVeyor
          - { os: windows-2022, arch: x64,   config: Release, name: strict,
              cxxflags: /permissive- /std:c++latest /utf-8 /F4000000, ldflags: /STACK:4000000 }
          # Shared library (DLL with import library fort.lib)
          - { os: windows-2022, arch: x64,   config: Release, name: shared, shared: true }
          - { os: windows-2022, arch: Win32, config: Debug,   name: shared, shared: true }
          # clang-cl with MSVC headers and CRT
          - { os: windows-2022, arch: x64,   config: Debug,   name: ClangCL, cmake_args: -T ClangCL }
          - { os: windows-2022, arch: Win32, config: Release, name: ClangCL, cmake_args: -T ClangCL }
    env:
      # CMake appends these to its default flags (unlike -DCMAKE_CXX_FLAGS, which replaces them)
      CXXFLAGS: ${{ matrix.cxxflags }}
      LDFLAGS: ${{ matrix.ldflags }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -DBUILD_SHARED_LIBS=${{ matrix.shared && 'ON' || 'OFF' }} ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Check import library and add DLL to PATH
        if: matrix.shared
        shell: pwsh
        run: |
          $dir = "$PWD\build\lib\${{ matrix.config }}"
          Get-ChildItem $dir
          if (-not (Test-Path "$dir\fort.dll")) { throw "fort.dll was not built" }
          if (-not (Test-Path "$dir\fort.lib")) { throw "fort.lib (import library) was not built" }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  windows-mingw:
    name: Windows MinGW ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc (UCRT64),      msystem: UCRT64,  compiler: gcc,   cc: gcc,   cxx: g++ }
          # 32-bit with legacy msvcrt.dll instead of UCRT
          - { name: gcc x86 (MINGW32), msystem: MINGW32, compiler: gcc,   cc: gcc,   cxx: g++ }
          # llvm-mingw: clang with libc++
          - { name: clang (CLANG64),   msystem: CLANG64, compiler: clang, cc: clang, cxx: clang++ }
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            ${{ matrix.compiler }}:p
            cmake:p
            ninja:p

      - name: Print tool versions
        run: |
          ${CC} --version
          ${CXX} --version
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_STANDARD=99
          -DCMAKE_CXX_STANDARD=11
          -DCMAKE_C_FLAGS=-Werror
          -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  alpine:
    name: Alpine (musl) gcc
    runs-on: ubuntu-24.04
    container: alpine:latest
    steps:
      - name: Install packages
        run: apk add gcc g++ musl-dev cmake make git

      - uses: actions/checkout@v5

      - name: Print tool versions
        run: |
          cat /etc/alpine-release
          gcc --version
          cmake --version

      - name: Build lib/fort.c as gnu89
        run: gcc -Wall -Wextra -Werror -std=gnu89 -c lib/fort.c -o fort.o

      - name: Build lib/fort.c with C++ compiler
        run: g++ -Wall -Wextra -Werror -x c++ -c lib/fort.c -o fort.o

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_STANDARD=99
          -DCMAKE_CXX_STANDARD=11
          -DCMAKE_C_FLAGS=-Werror
          -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  tcc:
    name: Alpine tcc
    runs-on: ubuntu-24.04
    container: alpine:latest
    steps:
      - name: Install packages
        run: apk add tcc tcc-libs-static tcc-dev musl-dev g++ cmake make git

      - uses: actions/checkout@v5

      - name: Print tool versions
        run: |
          tcc -v
          cmake --version

      # No -Werror: tcc doesn't know exit() is noreturn and warns about missing return values
      - name: Build lib/fort.c
        run: tcc -Wall -c lib/fort.c -o fort.o

      # Only C tests: C++ tests and examples need a C++ compiler
      - name: Build and test with wchar
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=tcc
          cmake --build build --parallel --target libfort_test_dev libfort_test
          ./build/tests/libfort_test_dev
          ./build/tests/libfort_test

      - name: Build and test without wchar
        run: |
          cmake -S . -B build-nowchar -DCMAKE_C_COMPILER=tcc -DFORT_ENABLE_WCHAR=OFF
          cmake --build build-nowchar --parallel --target libfort_test_dev libfort_test
          ./build-nowchar/tests/libfort_test_dev
          ./build-nowchar/tests/libfort_test

  armv7:
    name: Linux armv7 (32-bit, QEMU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: uraimo/run-on-arch-action@v3
        with:
          arch: armv7
          distro: alpine_latest
          install: apk add gcc g++ musl-dev cmake make
          env: |
            LANG: C.UTF-8
          run: |
            set -e
            uname -m
            gcc --version
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_STANDARD=99 \
              -DCMAKE_CXX_STANDARD=11 \
              -DCMAKE_C_FLAGS=-Werror \
              -DCMAKE_CXX_FLAGS=-Werror
            cmake --build build --parallel
            ctest --test-dir build --output-on-failure

  lint:
    name: Lint (codespell)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Settings are in .codespellrc
      - name: Check spelling
        run: pipx run codespell
